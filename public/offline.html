<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e2839">
    <title>Sin conexión - Posweb</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e2839;
            color: #f1f5f9;
            font-family: 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            padding: 16px;
            box-sizing: border-box;
        }

        img {
            width: 120px;
            border-radius: 24px;
        }

        h1 {
            font-size: 1.4rem;
            margin: 24px 0 8px;
        }

        p {
            color: #cbd5e1;
            margin: 0 0 24px;
        }

        button {
            background: #f97316;
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 12px 28px;
            font-size: 1rem;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div>
        <img src="/img/logokowi-v2.png" alt="Kowi">
        <h1>Sin conexión al servidor</h1>
        <p>Revisa la conexión a internet o a la red de la tienda e intenta de nuevo.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>
</body>

</html>
