<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Fondo -->
  <rect width="500" height="400" fill="#f8fafc" rx="20"/>

  <!-- Círculo decorativo grande -->
  <circle cx="250" cy="200" r="160" fill="#f1f5f9" opacity="0.6"/>

  <!-- Círculo decorativo mediano -->
  <circle cx="250" cy="200" r="120" fill="#e2e8f0" opacity="0.4"/>

  <!-- Círculo decorativo pequeño -->
  <circle cx="250" cy="200" r="80" fill="#cbd5e1" opacity="0.2"/>

  <!-- Números 404 con sombra -->
  <text x="250" y="210" font-family="Arial, sans-serif" font-size="130" font-weight="800" text-anchor="middle" fill="#e2e8f0" opacity="0.3" dx="3" dy="3">404</text>
  <text x="250" y="210" font-family="Arial, sans-serif" font-size="130" font-weight="800" text-anchor="middle" fill="#0f172a">404</text>

  <!-- Líneas decorativas -->
  <g opacity="0.15">
    <line x1="120" y1="280" x2="380" y2="280" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="250" cy="280" r="6" fill="#0f172a"/>
    <circle cx="230" cy="280" r="3" fill="#0f172a"/>
    <circle cx="270" cy="280" r="3" fill="#0f172a"/>
  </g>

  <!-- Puntos decorativos -->
  <g fill="#3b82f6" opacity="0.3">
    <circle cx="80" cy="80" r="4"/>
    <circle cx="420" cy="100" r="6"/>
    <circle cx="60" cy="300" r="3"/>
    <circle cx="440" cy="320" r="5"/>
    <circle cx="90" cy="150" r="2"/>
    <circle cx="410" cy="180" r="3"/>
  </g>

  <!-- Rectángulo decorativo inferior -->
  <rect x="150" y="300" width="200" height="4" rx="2" fill="#3b82f6" opacity="0.2"/>
  <rect x="200" y="300" width="100" height="4" rx="2" fill="#3b82f6" opacity="0.4"/>
</svg>
